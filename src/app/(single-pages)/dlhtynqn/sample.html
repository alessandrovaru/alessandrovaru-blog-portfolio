<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Scroll Trigger</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    
    <style>
        body {
            height: 2000px;
            margin: 0;
            padding: 0;
        }
        h1 {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }
        #hero-canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 1440px;
            height: auto;
            aspect-ratio: 1440/810;
        }
        .hero-section {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
    </style>
</head>
<body>
    <h1>DLHYTYNQN</h1>
    <canvas id="hero-canvas"></canvas>
    <div class="hero-section">
        <h2>DLHYTYNQN</h1>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin(ScrollTrigger);
            
            const canvas = document.getElementById("hero-canvas");
            const ctx = canvas.getContext("2d");

            // Set canvas size
            canvas.width = 1440;
            canvas.height = 810;

            const TOTAL_FRAMES = 385;
            let loadedImages = 0;
            let allImagesLoaded = false;

            const create_url = (frame) => {
                const id = frame.toString().padStart(3,"0");
                return `https://yke9xtrxmx4fbdix.public.blob.vercel-storage.com/FRAME${id}.jpg`;
            };

            const images = Array.from({ length: TOTAL_FRAMES }, (_, i) => {
                const img = new Image();
                img.crossOrigin = "anonymous"; // Add CORS support
                
                img.onload = () => {
                    loadedImages++;
                    console.log(`Loaded image ${i + 1}/${TOTAL_FRAMES}`);
                    
                    if (loadedImages === TOTAL_FRAMES) {
                        allImagesLoaded = true;
                        console.log('All images loaded!');
                        render(); // Initial render
                    }
                };
                
                img.onerror = () => {
                    console.error(`Failed to load image ${i}:`, create_url(i));
                    loadedImages++;
                    if (loadedImages === TOTAL_FRAMES) {
                        allImagesLoaded = true;
                        render(); // Render even if some images failed
                    }
                };
                
                img.src = create_url(i);
                return img;
            });

            const web = {
                frame: 0
            };

            gsap.to("h1", {
                scale: 1.1,
                autoAlpha: 0,
                scrollTrigger:{
                    scrub: true
                }
            });

            gsap.to(web, {
                frame: TOTAL_FRAMES - 1,
                ease: "none",
                snap: "frame",
                scrollTrigger: {
                    scrub: 0.5
                },
                onUpdate: () => {
                    if (allImagesLoaded) {
                        render();
                    }
                }
            });

            function render(){
                if (!allImagesLoaded) {
                    console.log('Images not loaded yet, skipping render');
                    return;
                }
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const currentFrame = Math.floor(web.frame);
                if (currentFrame >= 0 && currentFrame < images.length && images[currentFrame].complete) {
                    try {
                        ctx.drawImage(images[currentFrame], 0, 0, canvas.width, canvas.height);
                    } catch (error) {
                        console.error('Error drawing image:', error);
                    }
                } else {
                    console.log(`Frame ${currentFrame} not available or not loaded`);
                }
            }
        });
    </script>
</body>
</html>
